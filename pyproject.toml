[project]
name = "locale-lens"
version = "0.1.0"
description = "LocaleLens - 地区数据观察站：文件即真相，长期留档"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pypdf>=7.1.1",
    "pyyaml>=6.0",
]

[project.scripts]
locale-lens = "locale_lens.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locale_lens"]
