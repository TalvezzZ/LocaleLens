name: collect

# 采集在 GitHub 的 runner 上跑，不受本机休眠影响。
# 时间用 UTC：北京时间 = UTC+8
#   02:00 UTC = 10:00 北京   白天抓一次
#   13:30 UTC = 21:30 北京   ┐
#   14:30 UTC = 22:30 北京   ├ 晚上多抓几次，因为「当日成交」过了零点就没了
#   15:00 UTC = 23:00 北京   ┘ 多次抓取落到同一个 (region,indicator,period) 键，后者覆盖前者
#
# 为什么不排 23:55：Actions 的 cron 在高峰期会延迟几分钟到几十分钟，
# 23:55 有可能跑到次日 00:10，那时抓到的是「新的一天」，前一天的日终值就丢了。
# 留足 1 小时余量更稳。

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "只跑指定源（留空跑全部）"
        required: false
        default: ""
      backfill:
        description: "回填历史"
        type: boolean
        default: false
      force:
        description: "忽略频率守卫"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Shanghai
      AMAP_KEY: ${{ secrets.AMAP_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      # 频率守卫要靠 health/sources.jsonl 的历史判断，所以先把 data 分支拉下来
      - name: 恢复历史数据
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin data 2>/dev/null; then
            echo "✓ 找到 data 分支，恢复历史"
            git archive FETCH_HEAD | tar -x -C .
            du -sh raw data health 2>/dev/null || true
          else
            echo "○ 没有 data 分支，首次运行"
            mkdir -p raw data derived digest health
          fi

      # 先探测源站可达性：GitHub runner 是境外 IP，政府站/房产站有可能拒绝
      - name: 探测源站可达性
        run: |
          set +e
          for u in \
            "https://tmsf.com/newhouse/transactionDynamic_index.htm" \
            "http://tjj.hangzhou.gov.cn/" \
            "https://data.hangzhou.gov.cn/" \
            "https://restapi.amap.com/v3/config/district?key=$AMAP_KEY&keywords=%E6%9D%AD%E5%B7%9E&subdistrict=0"
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 -A "Mozilla/5.0" -L "$u" 2>/dev/null)
            echo "  $code  ${u:0:72}"
          done

      - name: 采集
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          uv run locale-lens run $ARGS

      - name: 显示摘要
        if: always()
        run: |
          echo "===== 源健康度 ====="
          uv run locale-lens health || true
          echo
          echo "===== 数据量 ====="
          du -sh raw data derived digest health 2>/dev/null || true
          find data -name '*.jsonl' 2>/dev/null | wc -l | xargs -I{} echo "  L1 文件 {} 个"

      - name: 发布到 data 分支
        if: always()
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
            echo "✓ 基于已有 data 分支"
          else
            git checkout -q --orphan data
            git rm -rq --cached . 2>/dev/null || true
            echo "✓ 新建 data 分支"
          fi

          rm -rf raw data derived digest health
          for d in raw data derived digest health; do
            if [ -d "$GITHUB_WORKSPACE/$d" ]; then cp -R "$GITHUB_WORKSPACE/$d" .; fi
          done

          git add -A
          if git diff --cached --quiet; then
            echo "○ 数据无变化，跳过提交"
            exit 0
          fi

          git -c user.name="locale-lens-bot" \
              -c user.email="bot@users.noreply.github.com" \
              commit -q -m "data: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push -q origin HEAD:data
          echo "✓ 已推送到 data 分支"

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "===== 采集日志（如有）====="
          tail -60 logs/collect.log 2>/dev/null || echo "(无本地日志)"
