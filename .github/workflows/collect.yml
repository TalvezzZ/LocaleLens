name: collect

# 采集跑在 GitHub runner 上，不受本机休眠影响。
#
# ⚠️ 关于 cron 时间（实测踩过的坑）：
#   2026-11-25 设了 UTC 13:30 / 14:30 / 15:00 三个点（北京 21:30 / 22:30 / 23:00），
#   实际在 UTC 22:40 / 23:12 / 23:23 执行 —— 延迟了 8~9 小时，跑到北京次日早上，
#   抓到的是新一天的「0 套」，前一天的日终值丢失。
#   GitHub 免费 runner 的 cron 在高峰期延迟是常态，不能依赖单个时间点。
#
# 应对：把触发分散到北京 18:00–23:00 整个窗口（UTC 10:00–15:00，每小时一次）。
#   因为「当日成交」写入同一个 (region, indicator, period) 键，后跑的覆盖前跑的，
#   所以多跑几次是无害的 —— 只要有一次落在北京 23:xx，就拿到接近日终的值。
#   即使某次被延迟到次日凌晨，它写的是新一天的文件，也不会污染昨天。
#
# 统计局（*.hangzhou.gov.cn）在境外 runner 被阻断，由本地定时任务负责，这里显式排除。

on:
  schedule:
    - cron: "0 0 * * *"    # 北京 08:00  早晨一次，确认计数器是否已清零
    - cron: "0 10 * * *"   # 北京 18:00  ┐
    - cron: "0 11 * * *"   # 北京 19:00  │
    - cron: "0 12 * * *"   # 北京 20:00  ├ 晚间窗口，多跑几次兜住日终值
    - cron: "0 13 * * *"   # 北京 21:00  │
    - cron: "0 14 * * *"   # 北京 22:00  │
    - cron: "0 15 * * *"   # 北京 23:00  ┘
  workflow_dispatch:
    inputs:
      source:
        description: "只跑指定源（留空跑全部）"
        required: false
        default: ""
      backfill:
        description: "回填历史"
        type: boolean
        default: false
      force:
        description: "忽略频率守卫"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Shanghai
      AMAP_KEY: ${{ secrets.AMAP_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      # 频率守卫要靠 health/sources.jsonl 的历史判断，所以先把 data 分支拉下来
      - name: 恢复历史数据
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin data 2>/dev/null; then
            echo "✓ 找到 data 分支，恢复历史"
            git archive FETCH_HEAD | tar -x -C .
            du -sh raw data health 2>/dev/null || true
          else
            echo "○ 没有 data 分支，首次运行"
            mkdir -p raw data derived digest health
          fi

      # 先探测源站可达性：GitHub runner 是境外 IP，政府站/房产站有可能拒绝
      - name: 探测源站可达性
        run: |
          set +e
          for u in \
            "https://tmsf.com/newhouse/transactionDynamic_index.htm" \
            "http://tjj.hangzhou.gov.cn/" \
            "https://data.hangzhou.gov.cn/" \
            "https://restapi.amap.com/v3/config/district?key=$AMAP_KEY&keywords=%E6%9D%AD%E5%B7%9E&subdistrict=0"
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 -A "Mozilla/5.0" -L "$u" 2>/dev/null)
            echo "  $code  ${u:0:72}"
          done

      - name: 采集
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          # 统计局本地跑，这里排除
          ARGS="$ARGS --exclude hangzhou.stats --exclude hangzhou.stats.bulletin"
          echo "北京现在: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          uv run locale-lens run $ARGS

      - name: 显示摘要
        if: always()
        run: |
          echo "===== 源健康度 ====="
          uv run locale-lens health || true
          echo
          echo "===== 数据量 ====="
          du -sh raw data derived digest health 2>/dev/null || true
          find data -name '*.jsonl' 2>/dev/null | wc -l | xargs -I{} echo "  L1 文件 {} 个"

      - name: 发布到 data 分支
        if: always()
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
            echo "✓ 基于已有 data 分支"
          else
            git checkout -q --orphan data
            git rm -rq --cached . 2>/dev/null || true
            echo "✓ 新建 data 分支"
          fi

          rm -rf raw data derived digest health
          for d in raw data derived digest health; do
            if [ -d "$GITHUB_WORKSPACE/$d" ]; then cp -R "$GITHUB_WORKSPACE/$d" .; fi
          done

          git add -A
          if git diff --cached --quiet; then
            echo "○ 数据无变化，跳过提交"
            exit 0
          fi

          git -c user.name="locale-lens-bot" \
              -c user.email="bot@users.noreply.github.com" \
              commit -q -m "data: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push -q origin HEAD:data
          echo "✓ 已推送到 data 分支"

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "===== 采集日志（如有）====="
          tail -60 logs/collect.log 2>/dev/null || echo "(无本地日志)"
